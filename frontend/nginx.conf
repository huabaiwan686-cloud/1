server {
    listen 80;
    server_name _;

    # 安全头：防止点击劫持、MIME 嗅探、XSS
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline';" always;

    # 前端 SPA
    # index.html 绝不缓存（入口文件，缓存会导致旧版前端一直不更新）
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # 带哈希的静态资源（js/css/图片）可长缓存，文件名变了就自动失效
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }
    }

    # 后端 API 反代：绝不缓存
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 防缓存：不让 nginx 或浏览器缓存 API 响应
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 上传的图片/处理结果
    location /uploads/ {
        proxy_pass http://api:8000;
    }
}
